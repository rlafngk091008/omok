<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>오목</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 휴대폰 대국 앱. 위에서 아래로 상단바, 수순 띠, 상대, 판, 나, 확인 버튼, 도구 막대. 단일 다크 테마. */
:root{
  /* 라이트 */
  --bg:#F1F3F9; --bar:#FFFFFF; --card:#FFFFFF; --pop:#FFFFFF; --head:#E8ECF5; --raise:#E3E7F1; --hover:#D6DCEA;
  --fg:#141A2B; --soft:#3C4560; --muted:#677087; --faint:#AEB5C5; --line:#DADFEA; --ava:#D8DEEA;
  --go:#2F66E0; --go-edge:#1E49AD; --go-hi:#3F75EC; --go-text:#2558CC; --tint:#2F66E0; --red:#C8321F; --warn:#C43A25; --flame:#D9730A;
  --ease:cubic-bezier(.22,.8,.3,1); --spring:cubic-bezier(.3,1.35,.5,1);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --cw:min(100vw,max(340px,calc(100vh - 318px)));
  --cw:min(100vw,max(340px,calc(100dvh - 318px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  /* 다크 */
  --bg:#141824; --bar:#0F1320; --card:#212737; --pop:#2A3144; --head:#2A3144; --raise:#2C3347; --hover:#3A4259;
  --fg:#F3F5FB; --soft:#C9D0E0; --muted:#8F98AE; --faint:#535C74; --line:#2C3347; --ava:#E4E8F1;
  --go:#4B7DF2; --go-edge:#2F56BA; --go-hi:#5F8DF7; --go-text:#93B4FF; --tint:#93B4FF; --red:#C8321F; --warn:#F2826E; --flame:#FFB54A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141824; --bar:#0F1320; --card:#212737; --pop:#2A3144; --head:#2A3144; --raise:#2C3347; --hover:#3A4259;
  --fg:#F3F5FB; --soft:#C9D0E0; --muted:#8F98AE; --faint:#535C74; --line:#2C3347; --ava:#E4E8F1;
  --go:#4B7DF2; --go-edge:#2F56BA; --go-hi:#5F8DF7; --go-text:#93B4FF; --tint:#93B4FF; --red:#C8321F; --warn:#F2826E; --flame:#FFB54A;
  color-scheme:dark}
:root.themeanim *{transition:background-color .3s,color .3s,border-color .3s!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);transition:background-color .3s;font-family:var(--font);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--go);outline-offset:1px}
.btn{font-weight:700;background:var(--raise);border-radius:6px;padding:12px;box-shadow:inset 0 -3px 0 #0003;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.go{background:var(--go);color:#fff;box-shadow:inset 0 -4px 0 var(--go-edge)}
.btn.go:hover:not(:disabled){background:var(--go-hi)}
.btn:disabled{cursor:default}
.btn.go:disabled{background:var(--raise);color:var(--muted);box-shadow:none}
.big{width:100%;height:52px;font-size:18px;font-weight:900}
input[type=text]{width:100%;padding:11px 12px;font:inherit;font-size:16px;color:var(--fg);background:var(--raise);border:0;border-radius:6px}
input::placeholder{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

/* 홈 */
.hbody{flex:1;min-height:0;overflow:auto;display:grid;grid-auto-rows:max-content;gap:20px;align-content:start;padding-block:8px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:26px;font-weight:900}
.logo{width:30px;height:30px;flex:none}
.sec{display:grid;gap:8px}
.sec h2{margin:0;font-size:15px;font-weight:700}
.row{display:flex;gap:8px}
.row>*{min-width:0}
.row>input{flex:1}
.msg{margin:0;font-size:13px;color:var(--warn)}
.hfoot{padding-block:10px 14px;background:var(--bg)}

/* 플레이 설정 */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.shead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:52px;text-align:center;font-weight:700;font-size:17px}
.shead button{font-size:24px;line-height:1;color:var(--soft);height:44px}
.sbody{flex:1;min-height:0;overflow:auto;display:grid;gap:14px;align-content:start;padding-block:8px 16px}
.onb{z-index:30}
.onbody{align-content:center;justify-items:center;text-align:center;gap:14px}
.onbody .logo{width:64px;height:64px}
.onbody h1{margin:0;font-size:28px;font-weight:900}
.onbody p{margin:0;color:var(--soft)}
.onbody input{max-width:320px;text-align:center;font-size:18px}
.lab{font-size:13px;font-weight:700;color:var(--soft)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{background:var(--raise);border-radius:6px;padding:12px 4px;font-weight:700;border:2px solid transparent}
.opt:hover{background:var(--hover)}
.opt[aria-pressed=true]{border-color:var(--go)}
.note{margin:0;font-size:13px;color:var(--muted)}

/* 대국 */
.game{height:100%;display:flex;flex-direction:column;width:var(--cw);max-width:100%;margin:0 auto}
.top{position:relative;flex:none;height:42px;display:grid;place-items:center;font-weight:900;font-size:17px}
.top .t{display:flex;align-items:center;gap:6px}
.top .logo{width:20px;height:20px}
.sig{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;display:flex;align-items:flex-end;gap:2px;height:18px}
.sig i{width:4px;background:var(--line);border-radius:1px}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:10px}.sig i:nth-child(3){height:14px}.sig i:nth-child(4){height:18px}
.sig.on i{background:var(--go)} .sig.idle i{background:var(--muted)} .sig.bad i:first-child{background:var(--warn)}
.strip{flex:none;height:30px;display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.strip::-webkit-scrollbar{display:none}
.strip .n{color:var(--muted);font-weight:500;margin-left:6px}
.strip .m{color:var(--soft);padding:1px 3px}
.strip .m.cur{color:var(--fg);border-bottom:2px solid var(--go)}
.strip .e{color:var(--muted);font-weight:500}
.player{flex:none;height:60px;display:flex;align-items:center;gap:10px;min-width:0}
.ava{flex:none;width:44px;height:44px;border-radius:4px;background:var(--ava);display:grid;place-items:center}
.dot{width:26px;height:26px;border-radius:50%}
.dot.b{background:radial-gradient(circle at 36% 30%,#6A6A6A,#222 55%,#0B0B0B)}
.dot.w{background:radial-gradient(circle at 36% 30%,#fff,#efeee8 75%,#c8c6bd);box-shadow:0 0 0 1px #0003}
.pinfo{min-width:0;flex:1}
.pname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub{font-size:13px;color:var(--muted);white-space:nowrap}
.psub.off{color:var(--warn)}
.clock{flex:none;min-width:92px;height:44px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;padding:0 10px}
.clock.w{background:#FFFFFF;color:#141A2B;box-shadow:0 0 0 1px #0002}.clock.b{background:#0B0E17;color:#fff}
.clock:not(.live){opacity:.42}
.clock.low{background:var(--red);color:#fff;opacity:1}
.clock.low:not(.live){opacity:.6}
.clock svg{width:18px;height:18px;flex:none}
.clock:not(.live) svg{display:none}
.turn{flex:none;font-size:13px;font-weight:700;padding:5px 12px;border-radius:4px;background:var(--go);color:#fff}
.bwrap{position:relative;flex:none;width:100%;aspect-ratio:1}
.board{display:block;width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.slot{flex:none;height:60px;display:flex;align-items:center;gap:8px}
.slot>*{flex:1;min-width:0}
.slot p{margin:0;font-size:14px;font-weight:500}
.slot .btn{height:48px}
.slot .btn.big{font-size:17px}
.tools{flex:none;display:grid;grid-template-columns:repeat(4,1fr);height:58px;margin-top:auto;background:var(--bar)}
.tools button{position:relative;display:grid;justify-items:center;align-content:center;gap:1px;font-size:12px;color:var(--soft)}
.tools button:disabled{color:var(--faint);cursor:default}
.tools svg{width:24px;height:24px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:10px;height:10px;border-radius:5px;background:var(--warn)}
.menu{position:fixed;z-index:15;left:max(12px,calc(50% - var(--cw)/2 + 12px));bottom:calc(66px + env(safe-area-inset-bottom,0px));width:224px;background:var(--pop);border-radius:12px;padding:6px;box-shadow:0 8px 24px #0009;display:grid}
.menu button{display:block;text-align:left;padding:11px 12px;border-radius:8px;font-weight:500}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu button:disabled{color:var(--faint);cursor:default}
.menu .danger{color:var(--warn);font-weight:700}
.chatsheet{position:fixed;z-index:14;left:0;right:0;bottom:0;margin:0 auto;width:var(--cw);max-width:100%;height:min(62%,460px);background:var(--bar);border-radius:12px 12px 0 0;box-shadow:0 -6px 24px #0008;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.chead{display:flex;align-items:center;justify-content:space-between;height:46px;font-weight:700;border-bottom:1px solid var(--line)}
.chead button{font-size:22px;color:var(--soft);width:36px;height:36px}
.log{flex:1;min-height:0;overflow:auto;padding-block:10px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.log p{margin:0}
.log b{margin-right:6px}
.log b.mine{color:var(--go-text)}
.log .hint{color:var(--muted);font-size:14px}
.say{display:flex;gap:8px;padding-block:8px}
.say input{flex:1;min-width:0}
.say .btn{flex:none;padding:0 14px}
.toast{position:fixed;z-index:13;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(calc(100vw - 24px),380px);background:var(--pop);border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px #0008;overflow-wrap:anywhere}
.toast b{display:block;font-size:13px}
.wait{position:absolute;inset:0;display:grid;place-items:center;background:#0006;padding:16px}
.wcard{width:min(290px,100%);background:var(--bar);border-radius:10px;padding:18px;display:grid;gap:10px;text-align:center}
.wcard p{margin:0;color:var(--soft)}
.wcard .msg{color:var(--warn)}
#codeBig{font-size:32px;font-weight:900;letter-spacing:.12em;user-select:all;-webkit-user-select:all}
.modal{position:fixed;z-index:18;inset:0;display:grid;place-items:center;background:#0009;padding:20px}
.mcard{position:relative;width:min(340px,100%);background:var(--card);border-radius:10px;overflow:hidden}
.mhead{background:var(--head);padding:18px 44px;text-align:center}
.mhead h2{margin:0;font-size:22px;font-weight:900;line-height:1.3}
.mhead p{margin:2px 0 0;color:var(--soft);font-size:14px}
.mx{position:absolute;right:6px;top:6px;width:38px;height:38px;font-size:22px;color:var(--soft)}
.mbody{padding:16px;display:grid;gap:8px}
.mini{width:62%;margin:6px auto 0;aspect-ratio:1;border-radius:8px;overflow:hidden;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rules{margin:0;padding-left:18px;font-size:14px;color:var(--soft);display:grid;gap:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* 홈 보강 */
.tabs{flex:1;min-height:0;display:flex;flex-direction:column}
.tab{flex:1;min-height:0;display:flex;flex-direction:column;animation:fadeIn .22s var(--ease)}
.hbar{flex:none;display:flex;align-items:center;gap:10px;padding-block:10px}
.hbar .ava{width:38px;height:38px}
.hbar .dot{width:22px;height:22px}
.tbtn{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--soft);border-radius:8px}
.tbtn:hover{background:var(--raise)}
.tbtn svg{width:22px;height:22px}
#nick{flex:1;min-width:0;background:none;padding:6px 0;font-weight:700;font-size:17px;border-radius:0}
.streak{flex:none;display:flex;align-items:center;gap:4px;font-weight:700;color:var(--flame)}
.streak svg{width:20px;height:20px}
.cards{display:flex;flex:none;min-height:158px;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-left:16px}
.cards::-webkit-scrollbar{display:none}
.pcard{color:#fff;position:relative;flex:0 0 74%;max-width:330px;height:158px;border-radius:10px;overflow:hidden;scroll-snap-align:start;text-align:left;display:block;background:#1B2132;transition:transform .15s var(--ease)}
.pcard:active{transform:scale(.98)}
.pcard svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pcard .veil{position:absolute;inset:0;background:linear-gradient(90deg,#141A2BEB 42%,#141A2B00 88%)}
.pcard .txt{position:absolute;left:14px;top:12px;bottom:12px;width:58%;display:flex;flex-direction:column;gap:2px}
.pcard b{font-size:18px;font-weight:900;line-height:1.3}
.pcard small{font-size:13px;color:#D5DCEC}
.pcard .tag{margin-top:auto;align-self:flex-start;background:var(--go);box-shadow:inset 0 -3px 0 var(--go-edge);border-radius:5px;padding:5px 12px 7px;font-weight:700;font-size:14px}
.pcard.alt{background:#2748A8}
.pcard.alt2{background:#4B3AA0}
.pcard .big-ico{position:absolute;right:12px;bottom:10px;width:84px;height:84px;opacity:.95}
.shd{display:flex;align-items:baseline;justify-content:space-between}
.shd h2{margin:0;font-size:15px;font-weight:700}
.shd button{font-size:13px;color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:8px;padding:12px 4px;display:grid;justify-items:center;gap:1px;min-width:0}
.tile svg{width:26px;height:26px}
.tile b{color:var(--fg);font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.3}
.tile span{font-size:12px;color:var(--muted)}
.fr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.frb{background:var(--card);border-radius:8px;padding:12px 4px;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:500;transition:transform .15s var(--ease),background .15s}
.frb:active{transform:scale(.96)}
.frb:hover{background:var(--hover)}
.frb svg{width:30px;height:30px}
.hist{display:grid;background:var(--card);border-radius:8px;overflow:hidden}
.hrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid #0002}
.hrow:first-child{border-top:0}
.hrow b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow small{display:block;color:var(--muted);font-size:12px}
.hrow time{color:var(--muted);font-size:12px}
.mark{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px;line-height:1}
.mark.w{background:var(--go)}.mark.l{background:#C2402F}.mark.d{background:#7A8296}
.none{margin:0;color:var(--muted);font-size:14px;background:var(--card);border-radius:8px;padding:14px}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);height:56px;background:var(--bar)}
.nav button{display:grid;justify-items:center;align-content:center;gap:1px;font-size:12px;color:var(--muted);transition:color .15s}
.nav button[aria-current=true]{color:var(--go-text)}
.nav svg{width:24px;height:24px}
.acct{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--raise);color:var(--soft);font-weight:900;font-size:15px;overflow:hidden}
.acct svg{width:22px;height:22px}
.acct.on{background:var(--go);color:#fff}
.fbox{display:grid;gap:8px}
.fcard{background:var(--card);border-radius:8px;padding:12px;display:grid;gap:10px}
.fcard p{margin:0;font-size:14px;color:var(--soft)}
.mytag{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
.mytag b{font-size:18px;letter-spacing:.08em;color:var(--fg);font-variant-numeric:tabular-nums}
.mytag .btn{margin-left:auto;padding:6px 12px;font-size:13px}
.flist{display:grid;background:var(--card);border-radius:8px;overflow:hidden}
.frow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow small{display:block;color:var(--muted);font-size:12px}
.frow .acts{display:flex;gap:6px}
.frow .btn{padding:7px 11px;font-size:13px}
.odot{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.odot.on{background:#2EAD5B;box-shadow:0 0 0 3px #2EAD5B33}
.flabel{font-size:12px;font-weight:700;color:var(--muted);margin:4px 2px 0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn svg{width:18px;height:18px}
.endless{background:var(--card);border-radius:10px;padding:14px;display:grid;gap:12px}
.endless .tile{background:var(--raise)}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 14px;border-radius:999px;background:var(--raise);font-weight:700;font-size:14px;border:2px solid transparent;transition:border-color .15s,background .15s,transform .12s var(--ease)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{border-color:var(--go);color:var(--go-text)}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pz{aspect-ratio:1;border-radius:8px;background:var(--card);font-weight:900;font-size:19px;display:grid;place-items:center;position:relative;transition:transform .15s var(--ease)}
.pz:active{transform:scale(.94)}
.pz small{position:absolute;bottom:5px;left:0;right:0;font-size:10px;font-weight:500;color:var(--muted)}
.pz.ok{background:var(--go);color:#fff}
.pz.ok small{color:#DCE6FF}
.pz.today{outline:2px solid var(--go);outline-offset:-2px}
.lcard{background:var(--card);border-radius:8px;padding:12px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.lcard svg{width:96px;height:96px;border-radius:6px;display:block}
.lcard b{display:block;font-weight:700;margin-bottom:2px}
.lcard p{margin:0;color:var(--soft);font-size:13.5px}

/* 모션 */
.btn,.opt,.tools button,.nav button{transition:background .15s,transform .12s var(--ease),box-shadow .12s,color .15s,border-color .15s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -1px 0 #0003}
.tools button:active:not(:disabled),.nav button:active{transform:scale(.9)}
.clock{transition:opacity .25s,background .25s,color .25s}
.player{transition:opacity .2s}
.game,.scr>.hfoot{animation:fadeIn .26s var(--ease)}
.sheet{animation:riseIn .28s var(--ease)}
.sheet.out{animation:riseOut .18s ease-in forwards}
.chatsheet{animation:riseIn .26s var(--ease)}
.chatsheet.out{animation:riseOut .18s ease-in forwards}
.menu{animation:popIn .18s var(--spring);transform-origin:12% 100%}
.menu.out{animation:popOut .14s ease-in forwards}
.modal{animation:fadeIn .2s ease-out}
.modal .mcard{animation:cardIn .3s var(--spring)}
.modal.out{animation:fadeOut .17s ease-in forwards}
.modal.out .mcard{animation:cardOut .17s ease-in forwards}
.wait .wcard{animation:cardIn .3s var(--spring)}
.toast{animation:toastIn .26s var(--spring)}
.toast.out{animation:toastOut .18s ease-in forwards}
.strip .m.cur{animation:fadeIn .25s ease-out}
.bshake{animation:shake .3s ease-in-out}
#pickG{transition:transform .14s var(--ease)}
#pickI{transform-box:fill-box;transform-origin:center}
#pickI.pop{animation:drop .18s var(--spring)}
#hoverC{transition:opacity .12s}
.new{animation:drop .22s var(--spring);transform-box:fill-box;transform-origin:center}
.fadein{animation:fadeIn .25s ease-out}
.rip{fill:none;stroke:#5A3B12;stroke-width:2;animation:ripple .42s ease-out forwards;transform-box:fill-box;transform-origin:center;pointer-events:none}
.ringin{animation:ringIn .3s var(--spring) backwards;transform-box:fill-box;transform-origin:center}
@keyframes drop{from{transform:scale(1.45);opacity:0}}
@keyframes ripple{from{transform:scale(.9);opacity:.55}to{transform:scale(1.9);opacity:0}}
@keyframes ringIn{from{transform:scale(1.6);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes riseIn{from{transform:translateY(40px);opacity:0}}
@keyframes riseOut{to{transform:translateY(40px);opacity:0}}
@keyframes popIn{from{transform:scale(.86);opacity:0}}
@keyframes popOut{to{transform:scale(.92);opacity:0}}
@keyframes cardIn{from{transform:scale(.9) translateY(10px);opacity:0}}
@keyframes cardOut{to{transform:scale(.95);opacity:0}}
@keyframes toastIn{from{transform:translate(-50%,-24px);opacity:0}}
@keyframes toastOut{to{transform:translate(-50%,-16px);opacity:0}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

<script>
/*RULES*/
const N=15, DIRS=[[1,0],[0,1],[1,1],[1,-1]], BLACK=1, WHITE=2;
const inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const at=(b,x,y)=>inb(x,y)?b[y*N+x]:3;
function run(b,x,y,dx,dy,c){
  let l=0,r=0;
  while(at(b,x-(l+1)*dx,y-(l+1)*dy)===c)l++;
  while(at(b,x+(r+1)*dx,y+(r+1)*dy)===c)r++;
  return {l,r,len:l+r+1};
}
const exactFive=(rule,c)=>rule==='no33'||(rule==='renju'&&c===BLACK);
function winLine(b,i,c,rule){
  const x=i%N,y=(i-x)/N;
  for(const [dx,dy] of DIRS){
    const {l,len}=run(b,x,y,dx,dy,c);
    if(exactFive(rule,c)?len===5:len>=5){
      const out=[];
      for(let k=0;k<len;k++)out.push((y+(k-l)*dy)*N+x+(k-l)*dx);
      return out;
    }
  }
  return null;
}
function fourCount(b,x,y,dx,dy,c){
  const seen=new Set();
  for(let s=-4;s<=0;s++){
    let n=0,gap=0,bad=false,key=[];
    for(let k=s;k<s+5;k++){
      const v=at(b,x+k*dx,y+k*dy);
      if(v===c){n++;key.push(k)}else if(v===0)gap++;else{bad=true;break}
    }
    if(bad||n!==4||gap!==1)continue;
    if(at(b,x+(s-1)*dx,y+(s-1)*dy)===c||at(b,x+(s+5)*dx,y+(s+5)*dy)===c)continue;
    seen.add(key.join());
  }
  return seen.size;
}
function isOpenThree(b,x,y,dx,dy,c,rule,depth){
  for(let t=-4;t<=4;t++){
    if(!t)continue;
    const px=x+t*dx,py=y+t*dy;
    if(at(b,px,py)!==0)continue;
    const p=py*N+px;
    b[p]=c;
    const {l,r,len}=run(b,x,y,dx,dy,c);
    let ok=false;
    if(len===4&&t>=-l&&t<=r){
      const ax=x-(l+1)*dx,ay=y-(l+1)*dy,bx=x+(r+1)*dx,by=y+(r+1)*dy;
      ok=at(b,ax,ay)===0&&at(b,bx,by)===0&&at(b,ax-dx,ay-dy)!==c&&at(b,bx+dx,by+dy)!==c;
    }
    b[p]=0;
    if(ok&&(depth>=4||!forbidden(b,p,c,rule,depth+1)))return true;
  }
  return false;
}
function forbidden(b,i,c,rule,depth=0){
  if(rule==='free'||(rule==='renju'&&c!==BLACK))return null;
  const x=i%N,y=(i-x)/N;
  b[i]=c;
  let reason=null,five=false,over=false,fours=0,threes=0;
  const lens=DIRS.map(([dx,dy])=>run(b,x,y,dx,dy,c).len);
  five=lens.includes(5); over=lens.some(n=>n>=6);
  if(!five){
    if(rule==='renju'&&over)reason='장목';
    if(!reason&&rule==='renju'){
      for(const [dx,dy] of DIRS)fours+=fourCount(b,x,y,dx,dy,c);
      if(fours>=2)reason='4-4';
    }
    if(!reason){
      for(const [dx,dy] of DIRS)if(isOpenThree(b,x,y,dx,dy,c,rule,depth))threes++;
      if(threes>=2)reason='3-3';
    }
  }
  b[i]=0;
  return reason;
}
/* 수순을 처음부터 다시 놓아 판을 만든다. 규칙에 어긋나면 null. */
function replay(moves,rule){
  const b=new Array(N*N).fill(0);
  let win=null;
  for(let k=0;k<moves.length;k++){
    const i=moves[k],c=k%2?WHITE:BLACK;
    if(win||!Number.isInteger(i)||i<0||i>=N*N||b[i]||forbidden(b,i,c,rule))return null;
    b[i]=c;
    const line=winLine(b,i,c,rule);
    if(line)win={color:c,line};
  }
  return {b,win,turn:moves.length%2?WHITE:BLACK,full:moves.length===N*N};
}
/*END*/

/* 초대 코드: 한글도 쓸 수 있게, 연결에 쓰는 이름은 글자를 16진수로 바꿔 만든다. */

/* 퍼즐: 정답은 저장하지 않고 규칙 엔진으로 바로 계산한다. */
const PUZ=[["win",[112,82,128,81,96,52,95,67,125,80,127,114,83,143,129,110]],["win",[112,84,141,125,111,142,113,144,109,93,154,143,96,95]],["win",[112,140,111,82,124,66,110,84,108,56,55,50,38,99,143,54]],["win",[112,110,114,129,142,139,97,126,157,116,145,84,98,128]],["block",[112,143,129,125,157,127,96,111,114,110,140,79,51,154,52,82]],["block",[112,98,81,96,83,111,54,82,41,125,79,68,127,110,129,143]],["block",[112,127,140,142,123,125,170,155,129,139,111,113,96,169,99,126]],["four",[112,141,127,111,143,156,169,130,155,83,80,79,128,139]],["four",[112,129,97,99,145,68,131,85,173,172]],["four",[112,125,99,128,100,114,108,158,175,186,188,115,102,140]],["double",[112,143,126,175,94,82,114,174,158,173,157,188,140,144]],["double",[112,110,82,124,54,50,156,111,80,94,68,152]]];
const PTITLE={win:'한 수로 5목을 완성하세요',block:'백의 승리를 막으세요',four:'막을 수 없는 열린 4를 만드세요',double:'4-3을 만들어 승부를 내세요'};
const PSHORT={win:'5목',block:'막기',four:'열린 4',double:'4-3'};
/*GEN*/
/* 정답이 될 수 있는 자리는 돌 근처뿐이라 그 칸만 살펴본다. */
function nearAny(b,i,d){
  const x=i%N,y=(i-x)/N;
  for(let dy=-d;dy<=d;dy++)for(let dx=-d;dx<=d;dx++){if(!dx&&!dy)continue;const v=at(b,x+dx,y+dy);if(v===1||v===2)return true}
  return false;
}
function winsFor(b,c){const o=[];for(let i=0;i<N*N;i++){if(b[i]||!nearAny(b,i,1)||forbidden(b,i,c,'renju'))continue;b[i]=c;if(winLine(b,i,c,'renju'))o.push(i);b[i]=0}return o}
function puzzleAns(moves,type){
  const b=replay(moves,'renju').b,o=[];
  if(type==='block')return winsFor(b,WHITE);
  for(let i=0;i<N*N;i++){
    if(b[i]||!nearAny(b,i,2)||forbidden(b,i,BLACK,'renju'))continue;
    b[i]=BLACK;
    const x=i%N,y=(i-x)/N,done=winLine(b,i,BLACK,'renju'),w=winsFor(b,BLACK).length;
    const three=DIRS.some(([dx,dy])=>isOpenThree(b,x,y,dx,dy,BLACK,'renju',0));
    if(type==='win'?done:type==='four'?(!done&&w>=2):(!done&&w===1&&three))o.push(i);
    b[i]=0;
  }
  return o;
}
/* 같은 seed면 언제나 같은 퍼즐이 나온다. 정답이 하나뿐인 판만 통과시킨다. */
function genPuzzle(type,seed){
  let s=(seed>>>0)||1;
  const rnd=n=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return (s>>>8)%n};
  for(let it=0;it<20000;it++){
    const n=[10,12,14,16][rnd(4)],m=[];let tries=0;
    while(m.length<n&&tries++<300){
      let p;
      if(!m.length)p=(5+rnd(5))*N+5+rnd(5);
      else{const q=m[rnd(m.length)],x=q%N+rnd(5)-2,y=Math.floor(q/N)+rnd(5)-2;p=x>=2&&y>=2&&x<13&&y<13?y*N+x:-1}
      if(p<0||m.includes(p))continue;
      const r=replay([...m,p],'renju');
      if(!r||r.win)continue;
      m.push(p);
    }
    if(m.length<n)continue;
    const b=replay(m,'renju').b;
    if(type!=='win'&&winsFor(b,BLACK).length)continue;
    if(type!=='block'&&winsFor(b,WHITE).length)continue;
    const a=puzzleAns(m,type);
    if(!a.length||a.length>(type==='four'?3:1))continue;
    return {type,moves:m};
  }
  return null;
}
/*ENDGEN*/
const dayStr=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const TYPES=['win','block','four','double'];
const today=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};

/* 퍼즐 만들기는 별도 작업자(Web Worker)에서 돌려 화면이 멈추지 않게 한다. */
const SRC=document.currentScript?document.currentScript.textContent:'';
let worker=null,wseq=0;const jobs=new Map();
function mkWorker(){
  try{
    const cut=(a,b)=>SRC.split(a)[1].split(b)[0];
    const code=cut('/*'+'RULES*/','/*'+'END*/')+cut('/*'+'GEN*/','/*'+'ENDGEN*/')+'\nonmessage=e=>{const d=e.data;postMessage({id:d.id,p:genPuzzle(d.type,d.seed)})};';
    const w=new Worker(URL.createObjectURL(new Blob([code],{type:'text/javascript'})));
    w.onmessage=e=>{const j=jobs.get(e.data.id);if(j){jobs.delete(e.data.id);j.f(e.data.p)}};
    w.onerror=()=>{worker=false;for(const [k,j] of jobs){jobs.delete(k);j.f(genPuzzle(j.type,j.seed))}};
    return w;
  }catch(e){return false}
}
function gen(type,seed){
  if(worker===null)worker=mkWorker();
  return new Promise(f=>{
    if(!worker){setTimeout(()=>f(genPuzzle(type,seed)),30);return}
    const id=++wseq;jobs.set(id,{type,seed,f});worker.postMessage({id,type,seed});
  }).then(p=>p||gen(type,(seed+7919)>>>0));
}

const clockRuns=r=>!!S.t&&S.moves.length>0&&!result(r)&&(mode==='local'||!!opponent());
function syncTick(){
  const k=S.game+':'+S.moves.length;
  if(k!==tickKey){tickKey=k;tickFrom=Date.now()}
}
function left(c,r){
  const ms=S.t[c-1];
  return clockRuns(r)&&r.turn===c?Math.max(0,ms-(Date.now()-tickFrom)):ms;
}
function fmt(ms){
  if(ms<20000)return `0:${String(Math.floor(ms/1000)).padStart(2,'0')}.${Math.floor(ms%1000/100)}`;
  const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
const CLOCK_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5" stroke-linecap="round"/></svg>';
function drawClock(pos,c,r){
  const el=$('c'+pos),ms=left(c,r),live=clockRuns(r)&&r.turn===c;
  el.className=`clock ${c===BLACK?'b':'w'}${live?' live':''}${ms<10000?' low':''}`;
  el.innerHTML=(live?CLOCK_ICON:'')+`<span>${fmt(ms)}</span>`;
}

function addChat(list){
  let added=false;
  for(const m of Array.isArray(list)?list:[list]){
    if(!m||typeof m.id!=='string'||typeof m.text!=='string'||!m.text.trim())continue;
    if(chat.some(x=>x.id===m.id))continue;
    const item={id:m.id,by:String(m.by||''),n:String(m.n||'친구').slice(0,12),text:m.text.slice(0,100)};
    chat.push(item);added=true;
    if(item.by!==me&&$('chat').hidden){unread++;peek(item)}
  }
  if(chat.length>200){chat=chat.slice(-200);chatDrawn=0;$('log').textContent=''}
  if(added){save();drawChat()}
  return added;
}
function drawChat(){
  const log=$('log');
  if(!chatDrawn)log.textContent='';
  for(;chatDrawn<chat.length;chatDrawn++){
    const m=chat[chatDrawn],p=document.createElement('p'),b=document.createElement('b');
    b.textContent=m.by===me?'나':m.n; if(m.by===me)b.className='mine';
    p.append(b,document.createTextNode(m.text)); log.append(p);
  }
  if(!chat.length){const p=document.createElement('p');p.className='hint';p.textContent='친구에게 인사를 건네 보세요.';log.append(p)}
  log.scrollTop=log.scrollHeight;
  $('badge').hidden=!unread;
}
function peek(m){
  const t=$('toast'),b=document.createElement('b');
  b.textContent=m.n;t.textContent='';t.append(b,document.createTextNode(m.text));t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>hide(t),3500);
}

function drawMini(line){

  const r=replay(S.moves,S.rule);let h='<rect width="200" height="200" fill="#DDB66C"/>';
  for(let k=0;k<=w;k++)h+=`<path d="M${U/2} ${U/2+k*U}H${200-U/2}M${U/2+k*U} ${U/2}V${200-U/2}" stroke="#6A4A1F" stroke-width=".8"/>`;
  for(let y=y0;y<y0+w;y++)for(let x=x0;x<x0+w;x++){
    if(!inb(x,y))continue;const v=r.b[y*N+x];if(!v)continue;
    const on=line.includes(y*N+x);
    h+=`<circle cx="${(x-x0)*U+U/2}" cy="${(y-y0)*U+U/2}" r="${U*.45}" fill="${v===BLACK?'#161616':'#F4F3EE'}" ${on?'stroke="#2F7BFF" stroke-width="2.5"':''}/>`;

/* 착수: 판을 눌러 자리를 고르고, 아래 버튼으로 확정한다. */
function cell(e){
  const q=$('board').getBoundingClientRect(),s=620/q.width;
  const x=Math.round(((e.clientX-q.left)*s-P)/C),y=Math.round(((e.clientY-q.top)*s-P)/C);
  return inb(x,y)?y*N+x:null;
}
function say(t){
  notice=t;render();clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>{notice='';render()},2000);
}
function tap(i){
  hide($('menu'));
  if(view!=null){view=null;render();return}
  const r=replay(S.moves,S.rule);
  if(i==null||!canPlayNow(r)||r.b[i])return;
  const why=forbidden(r.b,i,r.turn,S.rule);
  if(why){pick=null;say(`${why} 금수 자리예요`);return}
  if(pick===i){place();return}
  notice='';pick=i;render();
}
$('board').addEventListener('click',e=>tap(cell(e)));

function shake(){const b=$('board');b.classList.remove('bshake');void b.getBoundingClientRect();b.classList.add('bshake')}
function place(){
  const r=replay(S.moves,S.rule),i=pick;
  if(i==null||!canPlayNow(r)||r.b[i]||forbidden(r.b,i,r.turn,S.rule))return;
  pick=null;hover=null;
  if(puz){
    if(!puz.ans.includes(i)){puz.miss=true;shake();say('다시 생각해 보세요');return}
    puz.solved=true;
    if(puz.src==='fixed'&&!stat.solved.includes(puz.i))stat.solved.push(puz.i);
    if(puz.src==='daily')stat.daily=puz.day;
    if(puz.src==='endless'){stat.ez.n++;stat.ez.run=puz.miss?0:stat.ez.run+1;stat.ez.best=Math.max(stat.ez.best,stat.ez.run)}
    touchDay();saveStat();
  }
  commit(s=>{
    if(s.t&&s.moves.length){const c=r.turn;s.t[c-1]=left(c,r)+s.tc.inc}
    s.moves=[...s.moves,i];
  });
}

/* 온라인: Claude 안에서는 room, 일반 웹에서는 PeerJS. 위쪽 코드는 어느 쪽인지 모른다. */
async function roomNet(h,isFresh){
  const room=await window.claude.use('room');
  if(!room)throw {code:'not_granted'};
  const r=await room.join('omok-'+tid(code));
  let fresh=isFresh;setTimeout(()=>{fresh=false},2500);
  const pub=()=>r.presence({id:me,name:myName(),s:S.fromRoom?S:null,c:chat.filter(m=>m.by===me).slice(-5)}).catch(()=>{});
  r.onPeers(ch=>{
    const list=[];
    for(const p of ch.peers){
      if(p.sameTab)continue;
      const q=p.presence||{};
      if(typeof q.id!=='string'||q.id===me)continue;
      /* 새로 만든 방인데 이미 다른 판이 있으면 남이 쓰는 코드다. */
      if(fresh&&q.s&&Array.isArray(q.s.seats)&&!q.s.seats.includes(me)&&((q.s.made||0)<(S.made||0)||((q.s.made||0)===(S.made||0)&&q.id<me))){fresh=false;r.leave().catch(()=>{});h.taken();return}
      /* 같은 코드로 따로 방을 만든 사람은 상대로 앉히지 않는다. */
      const rival=!!(S.fromRoom&&q.s&&Array.isArray(q.s.seats)&&q.s.seats[0]&&q.s.seats[0]!==S.seats[0]);
      list.push({id:q.id,name:String(q.name||'').slice(0,12),rival});
      if(q.s&&!rival)h.state(q.s);
      if(q.c)h.chat(q.c);
    }
    h.peers(list);
  },e=>h.fail(e.code));
  r.onConnection(c=>h.conn(c),e=>h.fail(e.code));
  pub();
  return {send:pub,chat:pub,close:()=>r.leave().catch(()=>{})};
}
function loadPeer(){
  return new Promise((ok,no)=>{
    if(window.Peer)return ok();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
    s.onload=ok;s.onerror=no;document.head.appendChild(s);
  });
}
async function peerNet(h,isFresh){
  await loadPeer();
  let opened=false;
  const HUB='omok-game-'+tid(code), opts=window.__peerOpts||{};
  let peer=null,toHub=null,timer=null,closed=false;
  const conns=new Map();
  const others=c=>{
    const l=[...conns].filter(([k])=>k!==c).map(([,v])=>v);
    return c?[...l,{id:me,name:myName()}]:l;
  };
  const tell=()=>{for(const c of conns.keys())if(c.open)c.send({t:'peers',list:others(c)});h.peers(others(null))};
  const pushAll=m=>{for(const c of conns.keys())if(c.open)c.send(m)};
  function lost(){
    if(closed)return;
    h.conn(false);h.peers([]);toHub=null;conns.clear();
    if(peer){peer.destroy();peer=null}
    clearTimeout(timer);timer=setTimeout(start,2000);
  }
  function hub(){
    peer=new Peer(HUB,opts);
    peer.on('open',()=>{opened=true;h.conn(true)});
    peer.on('connection',c=>{
      c.on('data',m=>{
        if(!m||typeof m!=='object')return;
        if(m.t==='hello'){
          conns.set(c,{id:String(m.id),name:String(m.name||'').slice(0,12)});
          c.send({t:'state',s:S});c.send({t:'chat',m:chat.slice(-30)});tell();
        }
        if(m.t==='state'&&h.state(m.s))pushAll({t:'state',s:S});
        if(m.t==='chat'&&h.chat(m.m))pushAll({t:'chat',m:m.m});
      });
      c.on('close',()=>{conns.delete(c);tell()});
    });
    peer.on('disconnected',()=>{if(!closed&&peer&&!peer.destroyed)peer.reconnect()});
    peer.on('error',e=>{if(e.type==='unavailable-id'&&isFresh&&!opened){closed=true;peer.destroy();peer=null;h.taken();return}if(e.type==='unavailable-id'){peer.destroy();peer=null;client()}else if(e.type!=='peer-unavailable')lost()});
  }
  function client(){
    peer=new Peer(opts);
    peer.on('open',()=>{
      const c=peer.connect(HUB,{reliable:true});
      c.on('open',()=>{toHub=c;h.conn(true);c.send({t:'hello',id:me,name:myName()})});
      c.on('data',m=>{
        if(!m||typeof m!=='object')return;
        if(m.t==='state')h.state(m.s);
        if(m.t==='chat')h.chat(m.m);
        if(m.t==='peers'&&Array.isArray(m.list))h.peers(m.list);
      });
      c.on('close',lost);
    });
    peer.on('error',lost);
  }
  function start(){ S.fromRoom?hub():client() }
  start();
  const out=m=>{ if(toHub&&toHub.open)toHub.send(m); else pushAll(m) };
  return {
    send(s){out({t:'state',s})},
    chat(m){out({t:'chat',m})},
    close(){closed=true;clearTimeout(timer);if(peer)peer.destroy()}
  };
}
const handlers={
  state:accept,
  chat:addChat,
  conn(c){connected=c;render()},
  peers(list){
    online=list;
    if(S.fromRoom&&S.seats.includes(me)){
      const opp=opponent(), comer=list.find(p=>!S.seats.includes(p.id)&&!p.rival);
      const changed=list.some(p=>p.name&&S.names[p.id]!==p.name&&S.seats.includes(p.id));
      if(comer&&(!opp||!list.some(p=>p.id===opp)))commit(s=>{
        if(opp){s.seats=s.seats.map(x=>x===opp?comer.id:x);if(s.black===opp)s.black=comer.id;if(s.ask&&s.ask.by===opp)s.ask=null}
        else s.seats=s.seats.map(x=>x||comer.id);
        s.names[comer.id]=comer.name;
      });
      else if(changed)commit(s=>{for(const p of list)if(s.seats.includes(p.id))s.names[p.id]=p.name});
    }
    render();
  },
  fail(c){showFail(c)},
  ended(st){
    leave();
    const m=$('lobbyMsg');m.textContent=st==='declined'?'친구가 대국 신청을 거절했어요.':'친구가 대국 신청을 취소했어요.';m.hidden=false;
  },
  taken(){
    const c=code;
    if(net)net.close();net=null;clearTimeout(findTimer);
    store.del('sessionStorage','omok.room');
    reset();mode='home';code=null;online=[];connected=false;render();
    openSetup();$('myCode').value=c;
    const m=$('setupMsg');m.textContent=`'${showCode(c)}' 코드는 지금 다른 방에서 쓰고 있어요. 다른 코드를 정해 주세요.`;m.hidden=false;
  }
};
function showFail(){
  const m=$('roomMsg');
  m.textContent=window.claude?'이 화면에서는 온라인 대국을 쓸 수 없어요. 초대받은 Claude 계정으로 로그인해 다시 열어 주세요.':'온라인 연결에 실패했어요. 인터넷을 확인하고 다시 입장해 주세요.';
  m.hidden=false;connected=false;render();
}
function reset(){
  view=null;pick=null;hover=null;unread=0;chat=[];chatDrawn=0;tickKey='';
  puz=null;drawn=null;stripKey='';delayKey='';readyKey='';$('badge').hidden=true;
  $('fx').textContent='';$('fx').dataset.k='';
  for(const id of ['setup','menu','chat','over','ruleBox','toast','acctBox'])shut($(id));

async function enter(c,state,log,isFresh){
  if(net)net.close();
  reset();
  me=c.startsWith('@')&&authUser?authUser.uid:sessionMe;fbStatus='';
  code=c;mode='online';connected=false;online=[];
  S=state;chat=log||[];
  store.set('localStorage',nickKey(),myName());
  $('roomMsg').hidden=true;save();render();drawChat();
  clearTimeout(findTimer);
  if(!S.fromRoom&&!c.startsWith('@'))findTimer=setTimeout(()=>{const m=$('roomMsg');m.textContent='방을 찾지 못했어요. 코드가 맞는지, 친구가 방을 열어 두었는지 확인해 주세요.';m.hidden=false},9000);
  try{
    /* Firebase를 불러오는 중이면 잠깐 기다려, 친구와 같은 길로 연결되게 한다. */
    if(!c.startsWith('@')&&fbInitP&&!fb)await Promise.race([fbInitP,new Promise(f=>setTimeout(f,6000))]);
    const viaFire=!c.startsWith('@')&&fb&&await fbReady();
    const n=c.startsWith('@')?fireNet(c.slice(1),handlers):viaFire?roomFire(handlers,isFresh):window.claude&&window.claude.use?await roomNet(handlers,isFresh):await peerNet(handlers,isFresh);
    /* 연결되는 사이에 방을 나갔으면 바로 끊는다. */
    if(mode!=='online'||code!==c){n.close();return}
    net=n;
    if(!window.claude&&mode==='online'&&!c.startsWith('@'))try{history.replaceState(null,'','#'+tid(code))}catch(e){}

      const s=JSON.parse(JSON.stringify(S));delete s.fromRoom;
      return fb.set(path,{S:s,chat:[],made:Date.now(),active:Date.now(),seen:{[me]:Date.now()},who:{[me]:myName()}}).then(start);
    }).catch(()=>{if(!closed)h.fail('net')});
  }else start();
  return {
    send(s){
      const mine=JSON.parse(JSON.stringify(s));delete mine.fromRoom;
      fb.tx(path,cur=>cur&&cur.S&&cur.S.v>=mine.v?null:{S:mine})
        .then(ok=>{if(!ok&&code===c0)fb.get(path).then(d=>{if(d&&d.S){S=Object.assign(d.S,{fromRoom:true});save();render()}})})
        .catch(()=>{});
    },
    chat(m){fb.push(path,'chat',m).catch(()=>{})},
    close(){closed=true;clearInterval(t);un&&un();fb.update(path,{['seen.'+me]:0}).catch(()=>{})}
  };
}
/* 친구 대국: 판 상태를 Firestore 문서 하나에 두고 양쪽이 지켜본다. */
function fireNet(gid,h){
  const path='games/'+gid;let opp=null,oppSeen=0,oppU=null,closed=false;
  const tell=()=>h.peers(opp&&Date.now()-oppSeen<ONLINE_MS&&fbStatus==='play'?[{id:opp,name:''}]:[]);
  const un=fb.watch(path,d=>{
    if(closed||!d)return;
    const was=fbStatus;fbStatus=d.status||'';
    if(!opp){opp=(d.users||[]).find(x=>x!==me);if(opp)oppU=fb.watch('users/'+opp,u=>{oppSeen=u&&u.seen||0;tell()})}
    if(d.S)h.state(d.S);
    if(Array.isArray(d.chat))h.chat(d.chat);
    if(d.status==='declined'||d.status==='cancel'){h.ended(d.status);return}
    if(was!==fbStatus){tell();render()}
  });
  const t=setInterval(tell,15000);
  h.conn(true);
  return {
    send(s){
      const mine=JSON.parse(JSON.stringify(s));delete mine.fromRoom;
      fb.tx(path,cur=>cur&&cur.S&&cur.S.v>=mine.v?null:{S:mine})
        .then(ok=>{if(!ok)fb.get(path).then(d=>{if(d&&d.S){S=Object.assign(d.S,{fromRoom:true});save();render()}})})
        .catch(()=>{});
    },
    chat(m){fb.push(path,'chat',m).catch(()=>{})},
    close(){closed=true;un();oppU&&oppU();clearInterval(t)}
  };
}

function arrange(){
  const w=WG.matches,P=$('gpanel');
  const items=[document.querySelector('#game .top'),$('slot'),document.querySelector('#game .tools'),$('menu'),$('chat')];
  document.body.classList.toggle('wg',w);
  if(w){
    for(const el of items){if(P.contains(el))continue;el._home=[el.parentNode,el.nextSibling];P.append(el)}
    P.insertBefore($('mlist'),items[1]);
  }else{
    for(const el of [...items].reverse()){if(el._home&&P.contains(el)){el._home[0].insertBefore(el,el._home[1]&&el._home[1].parentNode===el._home[0]?el._home[1]:null)}}
    $('menu').hidden=true;$('chat').hidden=true;

}
